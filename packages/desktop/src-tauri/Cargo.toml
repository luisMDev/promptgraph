[package]
name = "promptgraph-desktop"
version = "0.1.0"
description = "promptgraph desktop shell (Tauri v2, Linux)"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "promptgraph-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned minor: WebviewWindowBuilder::on_new_window needs >= 2.8; Manager::add_capability and
# ipc::CapabilityBuilder come with the default `dynamic-acl` feature. See README.md.
tauri = { version = "~2.12", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# setsid() for the login shell and SIGKILL of its whole session on timeout.
libc = "0.2"
