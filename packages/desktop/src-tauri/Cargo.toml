[package]
name = "promptgraph-desktop"
version = "0.1.0"
description = "promptgraph desktop shell (Tauri v2, Linux)"
license = "MIT"
edition = "2021"
# The minimum of tauri 2.12, tauri-build 2.7 and tauri-plugin-opener 2.7.
rust-version = "1.90"

[[bin]]
name = "promptgraph-desktop"
path = "src/main.rs"

[build-dependencies]
# The tauri-build minor released with the tauri pin (both on tauri-utils ~2.10): a newer one would put a
# second tauri-utils in the graph and write ACL files an older tauri-codegen reads.
tauri-build = { version = "~2.7", features = [] }

[dependencies]
# Pinned minor: WebviewWindowBuilder::on_new_window needs >= 2.8; Manager::add_capability and
# ipc::CapabilityBuilder come with the default `dynamic-acl` feature. See README.md.
tauri = { version = "~2.12", features = [] }
tauri-plugin-opener = "2"
# Update checks run from Rust only (DESIGN §20.10); no updater permission reaches any webview.
# Not tauri-plugin-dialog (it injects window.alert/confirm into the daemon's page) and not
# tauri-plugin-process (AppHandle::restart suffices).
tauri-plugin-updater = "~2.14"
# The version tauri already pulls: native message dialogs only (src/dialog.rs).
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# setsid() for the login shell and SIGKILL of its whole session on timeout.
libc = "0.2"
