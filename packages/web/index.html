    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Theme before the first paint: dark unless the user chose light (src/lib/theme.ts, same storage key).
      try {
        if (localStorage.getItem("pg-theme") !== "light") document.documentElement.classList.add("dark");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
