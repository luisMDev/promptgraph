# Desktop app releases (DESIGN §20.11).
#
# `build` installs, tests and stages the bundled runtime with read-only permissions and no secret.
# `release` runs only for a pushed `desktop-vX.Y.Z` tag, in the protected `desktop-release`
# environment: it rebuilds from the staged runtime (no Node package, no lifecycle script), signs the
# updater artifacts with the key exposed to the tauri-action step only, and uploads the bundles and
# latest.json to a DRAFT release, which the maintainer reviews and publishes by hand. The AppImage tools
# are fetched and checksum-verified before that step (scripts/appimage-tools.sh), so nothing is downloaded
# while the key is in the environment.
#
# No cache anywhere: a cache written by another branch's run would be restored by a tag run and end
# up in a signed release. Every action is pinned by commit SHA.
name: Release desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      stage_sha256: ${{ steps.stage.outputs.sha256 }}
      prerelease: ${{ steps.guards.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils file build-essential python3

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # The Node version the app bundles (scripts/prepare-runtime.mjs NODE_VERSION), so node-gyp builds
      # pty.node against the headers of the Node that loads it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: 1.99.0

      # tauri-action would otherwise install an unpinned @tauri-apps/cli from npm.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      # Only the app packages and the root's dev tools; never site/ or video/.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @promptgraph/shared --filter @promptgraph/server --filter @promptgraph/web --filter @promptgraph/desktop

      - name: Guards
        id: guards
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            conf=packages/desktop/src-tauri/tauri.conf.json
            version="$(node -p "require('./$conf').version")"
            if [[ "${GITHUB_REF_NAME#desktop-v}" != "$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $conf version $version (run node scripts/set-version.mjs)"
              exit 1
            fi
            pubkey="$(node -p "require('./$conf').plugins.updater.pubkey")"
            if [[ -z "$pubkey" ]]; then
              echo "::error::plugins.updater.pubkey is empty in $conf (packages/desktop/README.md, Signing keys)"
              exit 1
            fi
            # X.Y.Z-pre is published as a pre-release, which releases/latest never serves to installed apps.
            if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
            echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          fi
          pnpm --filter @promptgraph/desktop test

      - name: Stage the runtime
        run: pnpm --filter @promptgraph/desktop runtime:prepare

      # A tarball, because workflow artifacts do not keep file modes.
      - name: Pack the runtime stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          tar -C packages/desktop -cJf runtime-stage.tar.xz runtime-stage
          echo "sha256=$(sha256sum runtime-stage.tar.xz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-stage
          path: runtime-stage.tar.xz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # The AppImage tools and runtime, checksum-pinned (DESIGN §20.11), so the bundler downloads nothing.
      - name: Fetch the pinned AppImage tools
        run: bash packages/desktop/scripts/appimage-tools.sh

      # Unsigned bundles as workflow artifacts: the same action and build on every run, manual ones too.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: packages/desktop
          tauriScript: cargo tauri
          args: --bundles deb,appimage --config src-tauri/tauri.bundle.conf.json -- --locked
          uploadWorkflowArtifacts: true

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils file build-essential python3

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: 1.99.0

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-stage

      - name: Unpack the runtime stage
        shell: bash
        env:
          STAGE_SHA256: ${{ needs.build.outputs.stage_sha256 }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          [[ "$STAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no runtime stage checksum from the build job"; exit 1; }
          [[ "$PRERELEASE" == true || "$PRERELEASE" == false ]] || { echo "::error::no pre-release flag from the build job"; exit 1; }
          echo "$STAGE_SHA256  runtime-stage.tar.xz" | sha256sum -c
          tar -C packages/desktop -xJf runtime-stage.tar.xz
          test -f packages/desktop/runtime-stage/manifest.json

      # Before the key exists: the bundler would otherwise download unverified tools in the signing step.
      - name: Fetch the pinned AppImage tools
        run: bash packages/desktop/scripts/appimage-tools.sh

      # Compiles every crate and build.rs before the signing key appears in any environment (DESIGN §17 D11).
      - name: Warm-up build (no secrets)
        working-directory: packages/desktop
        run: cargo tauri build --no-bundle --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.release.conf.json -- --locked

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tauriScript: cargo tauri
          args: --bundles deb,appimage --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.release.conf.json -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: promptgraph desktop v__VERSION__
          releaseBody: |
            Linux AppImage and .deb of the promptgraph desktop app (x86_64; Ubuntu 22.04 / Debian 12 or newer).

            Install notes, prerequisites and how updates work: https://github.com/luisMDev/promptgraph/blob/desktop-v__VERSION__/packages/desktop/README.md

            The app bundles Node and the promptgraph server. You still need `git`, `claude` (Claude Code), `curl` and, for pull-request steps, `gh`.
          releaseDraft: true
          prerelease: ${{ needs.build.outputs.prerelease }}
          uploadUpdaterJson: true
          retryAttempts: 1
